[package]
name = "ceryx-desktop"
version = "0.3.0"
description = "Ceryx Desktop host powered by Tauri"
authors = ["Ceryx Team"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
